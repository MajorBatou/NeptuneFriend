apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: neptunefriend-alertmanager
  namespace: monitoring
  labels:
    app: neptunefriend
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    receiver: 'default'
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: critical-alerts
        repeatInterval: 1h
      - matchers:
          - name: severity
            value: warning
        receiver: warning-alerts
        repeatInterval: 4h
      - matchers:
          - name: slo
            value: availability
        receiver: slo-alerts
        repeatInterval: 30m

  receivers:
    - name: 'default'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#neptunefriend-alerts'
          title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Namespace:* {{ .Labels.namespace }}
            {{ end }}

    - name: 'critical-alerts'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#neptunefriend-critical'
          title: 'CRITICAL: {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            {{ end }}

    - name: 'warning-alerts'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#neptunefriend-alerts'
          title: 'WARNING: {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            {{ end }}

    - name: 'slo-alerts'
      slackConfigs:
        - apiURL:
            name: alertmanager-secrets
            key: slack-webhook-url
          channel: '#neptunefriend-slo'
          title: 'SLO BREACH: {{ .CommonLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *SLO:* {{ .Labels.slo }}
            *Description:* {{ .Annotations.description }}
            {{ end }}

  inhibitRules:
    - sourceMatchers:
        - name: severity
          value: critical
      targetMatchers:
        - name: severity
          value: warning
      equal: ['alertname', 'namespace']
