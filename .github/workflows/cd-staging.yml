name: CD — Staging

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/neptunefriend

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web-tag: ${{ steps.meta-web.outputs.tags }}
      api-tag: ${{ steps.meta-api.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata — web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging

      - name: Docker metadata — api
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging

      - name: Build & push web image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig.yaml

      - name: Deploy to staging namespace
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl set image deployment/neptunefriend-web \
            web=${{ needs.build-and-push.outputs.web-tag }} \
            -n neptune-staging
          kubectl set image deployment/neptunefriend-api \
            api=${{ needs.build-and-push.outputs.api-tag }} \
            -n neptune-staging
          kubectl rollout status deployment/neptunefriend-web -n neptune-staging --timeout=120s
          kubectl rollout status deployment/neptunefriend-api -n neptune-staging --timeout=120s

      - name: Smoke test
        run: |
          sleep 10
          curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1
          echo "Smoke test passed"
