name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  lint-and-typecheck:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm -w apps/web run lint

      - name: Lint api
        run: npm -w apps/api run lint

      - name: Type check web
        run: npm -w apps/web run type-check

      - name: Type check api
        run: npm -w apps/api run type-check

      - name: Check formatting
        run: npx prettier --check "apps/**/*.{ts,tsx,js,json,css}"

  test-web:
    name: Test — web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run Vitest with coverage
        run: npm -w apps/web run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/

  test-api:
    name: Test — API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run API tests
        run: npm -w apps/api run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-web, test-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci

      - name: Build React app
        run: npm -w apps/web run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:4000' }}
          VITE_APP_ENV: production

      - name: Build API
        run: npm -w apps/api run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7
