---
# Service account for the API service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neptunefriend-api
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    project: neptunefriend
automountServiceAccountToken: false
---
# Service account for the web (React nginx) service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neptunefriend-web
  namespace: neptune-staging
  labels:
    app: neptunefriend-web
    project: neptunefriend
automountServiceAccountToken: false
---
# Service account for CI/CD pipeline deployments
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neptunefriend-deployer
  namespace: neptune-staging
  labels:
    project: neptunefriend
    role: deployer
automountServiceAccountToken: true
