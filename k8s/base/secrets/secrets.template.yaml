# IMPORTANT: Never commit real secret values to git
# This file is a template only — real values are applied via CI/CD pipeline
# or manually with: kubectl apply -f secrets.yaml (after filling in values)
#
# To create secrets manually:
# kubectl create secret generic neptunefriend-secrets \
#   --from-literal=DATABASE_URL="postgresql://user:password@host:5432/neptunefriend" \
#   --from-literal=REDIS_URL="redis://host:6379" \
#   --from-literal=OPENWEATHER_API_KEY="your_key" \
#   --from-literal=JWT_SECRET="your_secret" \
#   --namespace=neptune-staging

apiVersion: v1
kind: Secret
metadata:
  name: neptunefriend-secrets
  namespace: neptune-staging
  labels:
    project: neptunefriend
    environment: staging
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_REAL_VALUE"
  REDIS_URL: "REPLACE_WITH_REAL_VALUE"
  OPENWEATHER_API_KEY: "REPLACE_WITH_REAL_VALUE"
  WINDY_API_KEY: "REPLACE_WITH_REAL_VALUE"
  JWT_SECRET: "REPLACE_WITH_REAL_VALUE"
