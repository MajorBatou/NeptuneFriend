---
apiVersion: batch/v1
kind: Job
metadata:
  name: neptunefriend-migrate
  namespace: neptune-staging
  labels:
    app: neptunefriend-migrate
    project: neptunefriend
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: neptunefriend-migrate
        project: neptunefriend
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/majorbatou/neptunefriend-api:staging
          command: ["node", "apps/api/dist/db/migrate.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
