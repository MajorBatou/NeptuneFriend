apiVersion: apps/v1
kind: Deployment
metadata:
  name: neptunefriend-web
  namespace: neptune-staging
  labels:
    app: neptunefriend-web
    component: frontend
    project: neptunefriend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neptunefriend-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neptunefriend-web
        component: frontend
        project: neptunefriend
    spec:
      serviceAccountName: neptunefriend-web
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/majorbatou/neptunefriend-web:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
