apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neptunefriend-api-hpa
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    project: neptunefriend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neptunefriend-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
