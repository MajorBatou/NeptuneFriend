apiVersion: apps/v1
kind: Deployment
metadata:
  name: neptunefriend-api
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    component: backend
    project: neptunefriend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neptunefriend-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neptunefriend-api
        component: backend
        project: neptunefriend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: neptunefriend-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/majorbatou/neptunefriend-api:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: neptunefriend-config
                  key: WEB_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: REDIS_URL
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: OPENWEATHER_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
