apiVersion: apps/v1
kind: Deployment
metadata:
  name: neptunefriend-api
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    component: backend
    project: neptunefriend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neptunefriend-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neptunefriend-api
        component: backend
        project: neptunefriend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/majorbatou/neptunefriend-api:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: CORS_ORIGIN
              value: "*"
            - name: DATABASE_URL
              value: "postgresql://neptune:neptune@postgres:5432/neptunefriend"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: JWT_SECRET
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: OPENWEATHER_API_KEY
            - name: WORLDTIDES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: WORLDTIDES_API_KEY
            - name: METOFFICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: METOFFICE_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
