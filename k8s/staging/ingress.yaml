apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neptunefriend-ingress
  namespace: neptune-staging
  labels:
    project: neptunefriend
    environment: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - staging.neptunefriend.app
        - api.staging.neptunefriend.app
      secretName: neptunefriend-staging-tls
  rules:
    - host: staging.neptunefriend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neptunefriend-web
                port:
                  number: 80
    - host: api.staging.neptunefriend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neptunefriend-api
                port:
                  number: 4000
