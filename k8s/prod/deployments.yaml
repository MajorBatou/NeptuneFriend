---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neptunefriend-api
  namespace: neptune-prod
  labels:
    app: neptunefriend-api
    component: backend
    project: neptunefriend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neptunefriend-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neptunefriend-api
        component: backend
        project: neptunefriend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: neptunefriend-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/majorbatou/neptunefriend-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: CORS_ORIGIN
              value: "https://neptunefriend.app"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: JWT_SECRET
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: OPENWEATHER_API_KEY
            - name: WORLDTIDES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: WORLDTIDES_API_KEY
            - name: METOFFICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: neptunefriend-secrets
                  key: METOFFICE_API_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neptunefriend-web
  namespace: neptune-prod
  labels:
    app: neptunefriend-web
    component: frontend
    project: neptunefriend
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: neptunefriend-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: neptunefriend-web
        component: frontend
        project: neptunefriend
    spec:
      serviceAccountName: neptunefriend-web
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: ghcr.io/majorbatou/neptunefriend-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
