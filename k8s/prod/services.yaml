---
apiVersion: v1
kind: Service
metadata:
  name: neptunefriend-api
  namespace: neptune-prod
  labels:
    app: neptunefriend-api
    project: neptunefriend
spec:
  selector:
    app: neptunefriend-api
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: neptunefriend-web
  namespace: neptune-prod
  labels:
    app: neptunefriend-web
    project: neptunefriend
spec:
  selector:
    app: neptunefriend-web
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neptunefriend-api-hpa
  namespace: neptune-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neptunefriend-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neptunefriend-api-pdb
  namespace: neptune-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neptunefriend-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: neptunefriend-web-pdb
  namespace: neptune-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: neptunefriend-web
