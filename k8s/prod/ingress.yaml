---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neptunefriend-ingress
  namespace: neptune-prod
  labels:
    project: neptunefriend
    environment: prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # TLS — production Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # SSL
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limiting — stricter for prod
    nginx.ingress.kubernetes.io/limit-rps: "60"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://neptunefriend.app"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type"
spec:
  tls:
    - hosts:
        - neptunefriend.app
        - www.neptunefriend.app
        - api.neptunefriend.app
      secretName: neptunefriend-prod-tls
  rules:
    - host: neptunefriend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neptunefriend-web
                port:
                  number: 80
    - host: www.neptunefriend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neptunefriend-web
                port:
                  number: 80
    - host: api.neptunefriend.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neptunefriend-api
                port:
                  number: 4000
