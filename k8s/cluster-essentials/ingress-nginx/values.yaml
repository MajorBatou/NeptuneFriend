# Helm values for NGINX Ingress Controller
# Install with:
# helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
# helm install ingress-nginx ingress-nginx/ingress-nginx \
#   --namespace ingress-nginx \
#   --create-namespace \
#   --values k8s/cluster-essentials/ingress-nginx/values.yaml

controller:
  # Use AWS NLB for production-grade load balancing
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

  # Resource limits
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Replica count for HA
  replicaCount: 2

  # Security headers applied to all ingress
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    use-proxy-protocol: "false"
    # Security headers
    add-headers: "ingress-nginx/security-headers"
    # Rate limiting
    limit-req-status-code: "429"
    # SSL settings
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384"
    # Timeouts
    proxy-read-timeout: "60"
    proxy-send-timeout: "60"
    proxy-body-size: "10m"

  # Metrics for Prometheus
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

  # Pod disruption budget for zero-downtime deployments
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
