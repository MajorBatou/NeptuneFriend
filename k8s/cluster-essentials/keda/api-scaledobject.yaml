---
# KEDA ScaledObject — scales API based on request rate
# Requires KEDA installed in the cluster
# Install: helm install keda kedacore/keda --namespace keda --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: neptunefriend-api-keda
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    project: neptunefriend
spec:
  scaleTargetRef:
    name: neptunefriend-api
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 30
  pollingInterval: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: neptunefriend_http_requests
        threshold: "50"
        query: |
          sum(rate(neptunefriend_http_requests_total[1m]))
