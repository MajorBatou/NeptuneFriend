---
# KEDA ScaledObject — scales API based on request rate
# Requires KEDA installed in the cluster
# Install: helm install keda kedacore/keda --namespace keda --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: neptunefriend-api-keda
  namespace: neptune-staging
  labels:
    app: neptunefriend-api
    project: neptunefriend
spec:
  scaleTargetRef:
    name: neptunefriend-api
  minReplicaCount: 2
  maxReplicaCount: 10
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    # Scale on Prometheus metric — HTTP requests per second
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring.svc.cluster.local:9090
        metricName: neptunefriend_http_requests_per_second
        threshold: "50"
        query: |
          sum(rate(nginx_ingress_controller_requests{
            namespace="neptune-staging",
            service="neptunefriend-api"
          }[2m]))
