---
# Install kubectl, helm, and AWS CLI on nodes

- name: Install kubectl
  get_url:
    url: "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    owner: root
    group: root

- name: Verify kubectl installation
  command: kubectl version --client
  register: kubectl_version
  changed_when: false

- name: Print kubectl version
  debug:
    msg: "kubectl installed: {{ kubectl_version.stdout }}"

- name: Install Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm

- name: Verify Helm installation
  command: helm version
  register: helm_version
  changed_when: false

- name: Print Helm version
  debug:
    msg: "Helm installed: {{ helm_version.stdout }}"

- name: Install AWS CLI v2
  shell: |
    curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
    unzip -o /tmp/awscliv2.zip -d /tmp/
    /tmp/aws/install --update
    rm -rf /tmp/awscliv2.zip /tmp/aws
  args:
    creates: /usr/local/bin/aws

- name: Verify AWS CLI installation
  command: aws --version
  register: aws_version
  changed_when: false

- name: Print AWS CLI version
  debug:
    msg: "AWS CLI installed: {{ aws_version.stdout }}"

- name: Add Helm repos
  command: "helm repo add {{ item.name }} {{ item.url }}"
  loop:
    - { name: 'stable', url: 'https://charts.helm.sh/stable' }
    - { name: 'ingress-nginx', url: 'https://kubernetes.github.io/ingress-nginx' }
    - { name: 'cert-manager', url: 'https://charts.jetstack.io' }
    - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }
    - { name: 'grafana', url: 'https://grafana.github.io/helm-charts' }
  changed_when: false

- name: Update Helm repos
  command: helm repo update
  changed_when: false
