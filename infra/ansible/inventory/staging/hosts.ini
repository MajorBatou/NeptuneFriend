[eks_nodes]
# EKS worker nodes - IPs populated after terraform apply
# Run: aws ec2 describe-instances --filters "Name=tag:project,Values=neptunefriend" --query "Reservations[*].Instances[*].PublicIpAddress" --output text
# node1 ansible_host=REPLACE_WITH_NODE_IP ansible_user=ec2-user
# node2 ansible_host=REPLACE_WITH_NODE_IP ansible_user=ec2-user

[bastion]
# Optional bastion host for private cluster access
# bastion ansible_host=REPLACE_WITH_BASTION_IP ansible_user=ec2-user

[eks_nodes:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/neptunefriend-staging.pem
ansible_python_interpreter=/usr/bin/python3

[all:vars]
environment=staging
project=neptunefriend
aws_region=us-east-1
