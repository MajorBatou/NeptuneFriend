# NeptuneFriend Ansible Inventory
# Replace IP addresses with your actual server IPs after terraform apply

[staging]
staging-node-1 ansible_host=YOUR_STAGING_NODE_1_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/neptunefriend-staging.pem
staging-node-2 ansible_host=YOUR_STAGING_NODE_2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/neptunefriend-staging.pem

[prod]
prod-node-1 ansible_host=YOUR_PROD_NODE_1_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/neptunefriend-prod.pem
prod-node-2 ansible_host=YOUR_PROD_NODE_2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/neptunefriend-prod.pem

[eks_nodes:children]
staging
prod

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
