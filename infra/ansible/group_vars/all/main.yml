---
# Variables applied to all environments

project: neptunefriend
aws_region: us-east-1

# System packages to install on all nodes
common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - unzip
  - jq
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release
  - python3-pip
  - fail2ban
  - ufw

# SSH hardening
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_max_auth_tries: 3
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2

# Firewall allowed ports
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 80, proto: tcp, comment: "HTTP" }
  - { port: 443, proto: tcp, comment: "HTTPS" }
  - { port: 10250, proto: tcp, comment: "Kubelet API" }
  - { port: 30000:32767, proto: tcp, comment: "NodePort range" }

# Kernel parameters for K8s
sysctl_params:
  - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
  - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
  - { name: "net.ipv4.ip_forward", value: "1" }
  - { name: "vm.swappiness", value: "0" }
  - { name: "fs.inotify.max_user_watches", value: "524288" }
  - { name: "fs.file-max", value: "131072" }
