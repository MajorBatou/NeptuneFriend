[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
gathering = smart
fact_caching = memory
interpreter_python = auto_silent

# SSH settings
remote_user = ubuntu
private_key_file = ~/.ssh/neptunefriend-staging.pem
timeout = 30

# Performance
forks = 10
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
